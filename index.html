<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Household Ledger</title>
<meta name="theme-color" content="#2c6a4d">
<meta name="description" content="Track spending, budgets and household supplies, synced across your family's phones.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ledger">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: sticky header with month switch + tabs; one centered working column; rows stack on phones. */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --sunk:#e8ece6; --line:#d6dcd3;
  --ink:#1c2420; --muted:#5f6b64; --accent:#2c6a4d; --accent-ink:#ffffff; --accent-soft:#dcebe2;
  --warn:#9a6412; --warn-soft:#f6ead2; --bad:#a83a2a; --bad-soft:#f6dfda;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Public Sans", "Segoe UI", system-ui, sans-serif;
  --f-num:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a17; --surface:#1b231f; --sunk:#222c27; --line:#2f3b35;
  --ink:#e6ece8; --muted:#9aa8a0; --accent:#6cc39a; --accent-ink:#0e1a14; --accent-soft:#1f3a2d;
  --warn:#e0b25c; --warn-soft:#3a2f18; --bad:#ef8a78; --bad-soft:#3d221d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a17; --surface:#1b231f; --sunk:#222c27; --line:#2f3b35;
  --ink:#e6ece8; --muted:#9aa8a0; --accent:#6cc39a; --accent-ink:#0e1a14; --accent-soft:#1f3a2d;
  --warn:#e0b25c; --warn-soft:#3a2f18; --bad:#ef8a78; --bad-soft:#3d221d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body)}
.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:0;padding-top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:14px 10px}
h1{font:700 1.35rem/1.1 var(--f-display);margin:0;letter-spacing:-.01em}
h1 small{display:block;font:500 .72rem var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.month{display:flex;align-items:center;gap:6px}
.month span{font:600 .95rem var(--f-body);min-width:9.5em;text-align:center}
nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:0}
nav a{padding:9px 14px;border-bottom:2px solid transparent;color:var(--muted);text-decoration:none;font-weight:600;white-space:nowrap}
nav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
nav a .dot{display:inline-block;min-width:1.4em;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--bad-soft);color:var(--bad);font:500 .72rem/1.5 var(--f-num);text-align:center}
main{padding-block:20px calc(60px + env(safe-area-inset-bottom,0px));display:grid;gap:20px}
h2{font:600 1.05rem var(--f-display);margin:0 0 10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.muted{color:var(--muted)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
button,.btn{font:600 .88rem var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:6px 8px}
button.ghost:hover{color:var(--bad)}
button.danger{border-color:var(--bad);color:var(--bad)}
button.icon{width:34px;height:34px;padding:0;font:600 1.1rem/1 var(--f-num)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0;width:100%}
label{display:grid;gap:4px;font-size:.78rem;font-weight:600;color:var(--muted);letter-spacing:.03em}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat .k{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stat .v{font:500 1.35rem/1.3 var(--f-num);margin-top:4px}
.stat .v.bad{color:var(--bad)} .stat .v.good{color:var(--accent)}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:20px}
.two>*{min-width:0}
.bar{height:8px;border-radius:5px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.bar i.warn{background:var(--warn)} .bar i.bad{background:var(--bad)}
.catrow{display:grid;gap:5px;padding:9px 0;border-bottom:1px solid var(--line)}
.catrow:last-child{border-bottom:0}
.catrow .h{display:flex;justify-content:space-between;gap:10px;font-size:.92rem}
.list{display:grid}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .s{font-size:.8rem;color:var(--muted)}
.pill{font:600 .7rem/1 var(--f-body);letter-spacing:.05em;text-transform:uppercase;padding:5px 8px;border-radius:20px;white-space:nowrap}
.pill.ok{background:var(--accent-soft);color:var(--accent)}
.pill.low{background:var(--warn-soft);color:var(--warn)}
.pill.out{background:var(--bad-soft);color:var(--bad)}
.qty{display:flex;align-items:center;gap:6px}
.qty .n{min-width:2.4em;text-align:center;font:500 1rem var(--f-num)}
.restock{flex-basis:100%;background:var(--sunk);border-radius:8px;padding:12px;display:grid;gap:10px}
.item{flex-wrap:wrap}
.daygroup{font:600 .74rem var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:14px}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--warn-soft);color:var(--ink);border-radius:var(--r);padding:12px 14px;font-size:.9rem}
.empty{padding:22px 0;text-align:center;color:var(--muted)}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th{text-align:left;font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
td input{max-width:120px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:6px 12px}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.status{font-size:.85rem;color:var(--muted)}
.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
@media (max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.month span{min-width:7.5em}
  .item .grow{flex-basis:calc(100% - 100px)}.item .qty{margin-right:auto}nav a{padding:9px 10px}}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s ease}}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
body{margin:0;min-height:100vh}
.auth{max-width:420px;margin:24px auto;display:grid;gap:14px}
.auth form{display:grid;gap:12px}
.auth .links{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline}
.chip{font:600 .72rem var(--f-body);padding:4px 9px;border-radius:20px;background:var(--warn-soft);color:var(--warn);white-space:nowrap}
.acct{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <h1>Household Ledger<small>Spending · Budget · Supplies</small></h1>
      <div class="right">
        <span class="chip" id="netChip" hidden>Offline · changes will sync</span>
        <button id="installBtn" hidden>Install app</button>
        <div class="month" id="monthNav" hidden>
          <button class="icon" id="prevMonth" aria-label="Previous month">‹</button>
          <span id="monthLabel"></span>
          <button class="icon" id="nextMonth" aria-label="Next month">›</button>
        </div>
      </div>
    </div>
    <nav id="tabs" hidden>
      <a href="#overview" data-tab="overview">Overview</a>
      <a href="#expenses" data-tab="expenses">Expenses</a>
      <a href="#budget" data-tab="budget">Budget</a>
      <a href="#supplies" data-tab="supplies">Supplies<span class="dot" id="lowDot" hidden></span></a>
    </nav>
  </div>
</header>
<div class="wrap"><main id="view"><div class="panel empty">Loading…</div></main></div>
<script src="config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="app.js"></script>
</body>
</html>
